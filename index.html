const mkT=v=>({dur:v,d0:v,left:v,run:false,end:0,used:0,t0:0,ov:0,ex:0,add:0});
const mLeft=m=>m.run?Math.round((m.end-Date.now())/1000):m.left;

function mStart(m,v){if(v>0&&v!==m.dur){m.dur=v;m.left=v}if(m.left<=0)m.left=m.dur;if(m.left<=0)return false;if(!m.os&&!m.used){m.d0=m.left;m.os=1}m.end=Date.now()+m.left*1000;m.t0=Date.now();m.run=true;m.ex=0;return true}

function mSet(m,v){m.dur=v;if(!m.os)m.d0=v;if(m.run){m.left=v;m.end=Date.now()+v*1000;if(m.ex){m.ov=(m.ov||0)+(Date.now()-m.ex)/1000;m.ex=0}}else m.left=v}
function mAdj(m,d){if(m.run){m.end=Math.max(Date.now(),m.end+d*1000);if(m.ex&&m.end>Date.now()){m.ov=(m.ov||0)+(Date.now()-m.ex)/1000;m.ex=0}}else{m.left=Math.max(0,m.left+d);if(m.left>m.dur)m.dur=m.left}}

function pulses(){try{ringC=ringC||new(window.AudioContext||window.webkitAudioContext)();const c=ringC;if(c.state=='suspended')c.resume();
 for(let i=0;i<3;i++){const t=c.currentTime+i*.28,o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=1700;

 try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
